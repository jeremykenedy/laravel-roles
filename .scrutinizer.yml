build:
    nodes:
        analysis:
            dependencies:
                override:
                    # Resolved rather than installed from the lock. The lock is
                    # built on a newer runtime than the one the inspection runs,
                    # and only the runtime packages are needed to analyse src.
                    - composer update --no-dev --prefer-dist --no-interaction
            tests:
                override:
                    - php-scrutinizer-run

filter:
    paths:
        - src/*
    excluded_paths:
        - tests/*
        - vendor/*
        - src/resources/*

checks:
    php: true

tools:
    external_code_coverage: false
