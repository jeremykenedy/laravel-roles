build:
    nodes:
        analysis:
            environment:
                php:
                    version: '8.3'
            dependencies:
                override:
                    # Resolved rather than installed from the lock, so the
                    # runtime here does not have to match the one the lock
                    # was built on. Only the runtime packages are needed to
                    # analyse src/.
                    - composer update --no-dev --prefer-dist --no-interaction
            tests:
                override:
                    - php-scrutinizer-run

filter:
    paths:
        - src/*
    excluded_paths:
        - tests/*
        - vendor/*
        - src/resources/*

checks:
    php: true

tools:
    external_code_coverage: false
