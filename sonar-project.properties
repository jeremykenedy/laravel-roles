sonar.projectKey=jeremykenedy_laravel-roles
sonar.organization=jeremykenedy-12345

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Blade templates are markup rather than analysable PHP.
sonar.exclusions=src/resources/views/**,src/resources/lang/**

# The seeders under publish/ are stubs in the consuming application's
# namespace, copied into database/seeders by vendor:publish. Nothing in
# this package autoloads or runs them, so they cannot carry coverage.
sonar.coverage.exclusions=src/Database/Seeders/publish/**

sonar.php.coverage.reportPaths=coverage.xml
